{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>DeliFood | Driver Onboarding</title>
    
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <style>
        :root {
            --primary: #49005c;
            --primary-container: #631f75;
            --on-primary: #ffffff;
            --background: #ffffff;
            --on-surface-variant: #4e434f;
            --font-headline: 'Manrope', sans-serif;
            --font-body: 'Inter', sans-serif;
            --input-border: #e0e0e0;
        }

        body {
            background-color: var(--background);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .signup-container { width: 100%; max-width: 480px; padding: 1rem; }
        
        .logo-section { text-align: center; margin-bottom: 1.2rem; }
        .logo-img { height: 110px; width: auto; margin-bottom: 0.2rem; }
        
        .signup-card {
            background-color: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            border: 1px solid #f3f3f3;
            overflow: hidden; /* Clips the character background & progress bar */
        }

        /* Progress Bar */
        .step-indicator {
            height: 4px;
            background: #f0f0f0;
            width: 100%;
            position: relative;
        }

        .step-progress {
            position: absolute;
            height: 100%;
            background: linear-gradient(to right, var(--primary), var(--primary-container));
            width: 50%; /* Initial Step 1 state */
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 2D Character Section */
        .character-bg {
            background-color: #fdf8ff;
            padding: 2.5rem 1rem;
            text-align: center;
            border-bottom: 1px solid #f8f0fb;
        }

        .rider-img {
            width: 180px;
            animation: drive 3s ease-in-out infinite;
        }

        @keyframes drive {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }

        .step-view { padding: 1.8rem 2.2rem; display: none; }
        .step-view.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .headline {
            font-family: var(--font-headline);
            font-weight: 800;
            color: var(--primary);
            font-size: 1.4rem;
            letter-spacing: -0.5px;
        }

        .form-label { 
            font-size: 0.75rem; 
            font-weight: 600; 
            color: var(--on-surface-variant); 
            margin-bottom: 0.3rem; 
            display: block; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Styling the Django form inputs */
        .signup-card select, .signup-card input {
            background-color: #ffffff !important; 
            border: 1px solid var(--input-border) !important;
            border-radius: 0.8rem !important;
            padding: 0.7rem 1rem !important;
            font-size: 0.85rem;
            width: 100%;
            margin-bottom: 1rem;
        }

        .btn-driver {
            background: linear-gradient(to right, var(--primary), var(--primary-container));
            color: white; 
            border: none; 
            border-radius: 50px;
            padding: 0.9rem 1rem; 
            width: 100%; 
            font-weight: 700; 
            font-family: var(--font-headline); 
            font-size: 0.95rem;
            transition: all 0.3s ease; 
            box-shadow: 0 4px 12px rgba(73, 0, 92, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-driver:hover { 
            transform: translateY(-2px); 
            filter: brightness(1.1); 
            color: white; 
        }

        .btn-back {
            background-color: #f8f9fa;
            color: #666;
            border-radius: 50px;
            padding: 0.9rem 1rem;
            font-weight: 700;
            border: none;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .btn-back:hover { background-color: #eee; }
    </style>
</head>
<body>

<main class="signup-container">
    <div class="logo-section">
        <img src="{% static 'images/delifood.png' %}" class="logo-img" alt="Delidiver Logo">
    </div>

    <div class="signup-card">
        <div class="step-indicator">
            <div class="step-progress" id="progress-bar"></div>
        </div>

        <form method="POST" enctype="multipart/form-data" id="onboardingForm">
            {% csrf_token %}

            <div class="step-view active" id="step1">
                <div class="character-bg mx-n4 mt-n4 mb-4">
                    <img src="{% static 'images/deliside.png' %}" class="rider-img" alt="Driver Character">
                </div>
                
                <div class="text-center">
                    <h1 class="headline">Ready to roll, {{ user.first_name }}?</h1>
                    <p class="text-muted small mb-4">
                        You're logged in as <strong>{{ full_name }}</strong>. 
                        Let's get your vehicle info so you can start delivering.
                    </p>
                    
                    <button type="button" class="btn-driver" onclick="changeStep(2)">
                        Get Started 
                        <span class="material-symbols-outlined" style="font-size: 1.2rem;">arrow_forward</span>
                    </button>
                </div>
            </div>

            <div class="step-view" id="step2">
                <h1 class="headline mb-4 text-center">Vehicle Details</h1>
                
                <div class="mb-2">
                    <label class="form-label">Vehicle Type</label>
                    {{ form.vehicle_type }}
                </div>

                <div class="mb-4">
                    <label class="form-label">License Plate Number</label>
                    {{ form.license_plate }}
                </div>

                <div class="d-flex gap-2 mt-2">
                    <button type="button" class="btn-back flex-grow-1" onclick="changeStep(1)">Back</button>
                    <button type="submit" class="btn-driver flex-grow-1">Complete Setup</button>
                </div>
            </div>
        </form>
    </div>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem;">
        <a href="{% url 'home' %}" style="color: var(--primary); text-decoration: none; font-weight: 700; opacity: 0.7;">
            <span class="material-symbols-outlined align-middle" style="font-size: 1rem;">west</span> Back to Home
        </a>
    </div>
</main>

<script>
    function changeStep(stepNum) {
        // Switch views
        document.querySelectorAll('.step-view').forEach(view => view.classList.remove('active'));
        document.getElementById('step' + stepNum).classList.add('active');

        // Update progress bar width
        const bar = document.getElementById('progress-bar');
        if (stepNum === 1) {
            bar.style.width = '50%';
        } else {
            bar.style.width = '100%';
        }
    }
</script>

<script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
