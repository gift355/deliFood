{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <style>
        :root {
            --primary: #49005c;
            --primary-container: #631f75;
            --background: #ffffff;
            --on-surface-variant: #4e434f;
            --font-headline: 'Manrope', sans-serif;
            --font-body: 'Inter', sans-serif;
            --input-border: #e0e0e0;
        }

        body {
            background-color: var(--background);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-container { width: 100%; max-width: 420px; padding: 1rem; }
        
        .logo-section { text-align: center; margin-bottom: 1.5rem; }
        .logo-img { height: 110px; width: auto; margin-bottom: 0.2rem; }
        
        .headline {
            font-family: var(--font-headline);
            font-weight: 800;
            color: var(--primary);
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            margin-bottom: 0.1rem;
        }

        .sub-headline {
            font-size: 0.85rem;
            color: var(--on-surface-variant);
            font-weight: 500;
        }

        .login-card {
            background-color: #ffffff;
            border-radius: 1.25rem;
            padding: 2.5rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            border: 1px solid #f3f3f3;
        }

        .form-label { 
            font-size: 0.8rem; 
            font-weight: 600; 
            color: var(--on-surface-variant); 
            margin-bottom: 0.4rem; 
            display: block; 
        }

        .form-control {
            background-color: #ffffff !important; 
            border: 1px solid var(--input-border) !important;
            border-radius: 0.6rem !important;
            padding: 0.7rem 1rem !important;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 3px rgba(73, 0, 92, 0.05) !important;
            outline: none;
        }

        .input-group-custom { position: relative; }
        .input-group-custom .material-symbols-outlined {
            position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%);
            font-size: 20px; color: rgba(0,0,0,0.25); z-index: 5;
        }
        .input-group-custom .form-control { padding-left: 2.8rem !important; }

        .btn-login {
            background: linear-gradient(to right, var(--primary), var(--primary-container));
            color: white; 
            border: none; 
            border-radius: 50px;
            padding: 0.8rem;
            width: 100%; 
            font-weight: 700; 
            font-size: 1rem;
            margin-top: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(73, 0, 92, 0.12);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(73, 0, 92, 0.2);
            filter: brightness(1.1);
        }

        .footer-links { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; }
        .footer-links a { color: var(--primary); font-weight: 700; text-decoration: none; }
        
        .error-msg {
            background-color: #fff0f0;
            color: #d32f2f;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            margin-bottom: 1rem;
            text-align: center;
            border: 1px solid #ffcdd2;
        }
    </style>
</head>
<body>

<main class="login-container">
    <div class="logo-section">
        <img src="/static/images/delifood.png" class="logo-img" alt="DeliFood Logo">
        <h1 class="headline">Welcome Back</h1>
        <p class="sub-headline">Log in to continue your premium journey.</p>
    </div>

    <div class="login-card">
        {% if form.errors %}
            <div class="error-msg">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group-custom">
                    <span class="material-symbols-outlined">person</span>
                    <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group-custom">
                    <span class="material-symbols-outlined">lock</span>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button class="btn-login" type="submit">Sign In</button>
        </form>

        <div class="footer-links">
            <p>New to DeliFood? <a href="{% url 'signup' %}">Create Account</a></p>
        </div>
    </div>
</main>

<script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
