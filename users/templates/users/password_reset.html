{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Forgot Password | DeliFood</title>
    
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <style>
        :root {
            --primary: #49005c;
            --primary-container: #631f75;
            --on-primary: #ffffff;
            --background: #ffffff; 
            --on-surface-variant: #4e434f;
            --font-headline: 'Manrope', sans-serif;
            --font-body: 'Inter', sans-serif;
            --input-border: #e0e0e0;
        }
        body { background-color: var(--background); font-family: var(--font-body); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .signup-container { width: 100%; max-width: 440px; padding: 1rem; }
        .logo-section { text-align: center; margin-bottom: 1.2rem; }
        .logo-img { height: 110px; width: auto; margin-bottom: 0.2rem; }
        .headline { font-family: var(--font-headline); font-weight: 800; color: var(--primary); font-size: 1.4rem; letter-spacing: -0.5px; }
        .sub-headline { font-size: 0.8rem; color: var(--on-surface-variant); font-weight: 500; }
        .signup-card { background-color: #ffffff; border-radius: 1.25rem; padding: 1.8rem 2.2rem; box-shadow: 0 10px 40px rgba(0,0,0,0.06); border: 1px solid #f3f3f3; }
        .form-label { font-size: 0.75rem; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 0.2rem; display: block; }
        .form-control { background-color: #ffffff !important; border: 1px solid var(--input-border) !important; border-radius: 0.6rem !important; padding: 0.55rem 0.9rem !important; font-size: 0.85rem; }
        .form-control:focus { border-color: var(--primary) !important; box-shadow: 0 0 0 3px rgba(73, 0, 92, 0.05) !important; outline: none; }
        .input-group-custom { position: relative; }
        .input-group-custom .material-symbols-outlined { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); font-size: 18px; color: rgba(0,0,0,0.25); z-index: 5; }
        .input-group-custom .form-control { padding-left: 2.6rem !important; width: 100%; }
        .btn-signup { background: linear-gradient(to right, var(--primary), var(--primary-container)); color: white; border: none; border-radius: 50px; padding: 0.7rem 1rem; width: 100%; font-weight: 700; font-family: var(--font-headline); font-size: 0.95rem; margin-top: 1rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(73, 0, 92, 0.12); text-decoration: none; }
        .btn-signup:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(73, 0, 92, 0.2); filter: brightness(1.1); color: white; }
        .signin-link { text-align: center; font-size: 0.85rem; margin-top: 1.2rem; }
        .signin-link a { color: var(--primary); font-weight: 700; text-decoration: none; }
        .error-alert { background-color: #fff0f0; border-left: 4px solid #d32f2f; color: #d32f2f; padding: 10px 15px; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.8rem; }
    </style>
</head>
<body>
<main class="signup-container">
    <div class="logo-section">
        <img src="{% static 'images/delifood.png' %}" class="logo-img" alt="DeliFood Logo">
        <h1 class="headline">Forgot Password</h1>
        <p class="sub-headline">Recover your DeliFood account security credentials.</p>
    </div>
    <div class="signup-card">
        {% if form.errors %}
            <div class="error-alert">
                <p class="fw-bold mb-0">Please enter a valid active user email layout.</p>
            </div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group-custom">
                    <span class="material-symbols-outlined">mail</span>
                    <input type="email" name="email" id="id_email" class="form-control" placeholder="name@example.com" required>
                </div>
            </div>
            <button class="btn-signup" type="submit">
                <span class="material-symbols-outlined fs-5">lock_open</span> Send Reset Link
            </button>
        </form>
        <div class="signin-link">
            <a href="{% url 'login' %}">← Back to Sign In</a>
        </div>
    </div>
</main>
</body>
</html>
