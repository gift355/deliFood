{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Set New Password | DeliFood</title>
    
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <style>
        :root {
            --primary: #49005c;
            --primary-container: #631f75;
            --on-surface-variant: #4e434f;
            --font-headline: 'Manrope', sans-serif;
            --font-body: 'Inter', sans-serif;
            --input-border: #e0e0e0;
        }
        body { background-color: #ffffff; font-family: var(--font-body); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .signup-container { width: 100%; max-width: 440px; padding: 1rem; }
        .logo-section { text-align: center; margin-bottom: 1.2rem; }
        .logo-img { height: 110px; width: auto; margin-bottom: 0.2rem; }
        .headline { font-family: var(--font-headline); font-weight: 800; color: var(--primary); font-size: 1.4rem; letter-spacing: -0.5px; }
        .signup-card { background-color: #ffffff; border-radius: 1.25rem; padding: 1.8rem 2.2rem; box-shadow: 0 10px 40px rgba(0,0,0,0.06); border: 1px solid #f3f3f3; }
        .btn-signup { background: linear-gradient(to right, var(--primary), var(--primary-container)); color: white; border: none; border-radius: 50px; padding: 0.7rem 1rem; width: 100%; font-weight: 700; font-family: var(--font-headline); font-size: 0.95rem; margin-top: 1.5rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-signup:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .error-alert { background-color: #fff0f0; border-left: 4px solid #d32f2f; color: #d32f2f; padding: 10px 15px; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.8rem; }
        
        /* Injected override selector to transform auto-rendered form.as_p inputs into your exact theme fields */
        .django-form-fields p { margin-bottom: 0.8rem; }
        .django-form-fields label { font-size: 0.75rem; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 0.2rem; display: block; }
        .django-form-fields input { width: 100%; border: 1px solid var(--input-border) !important; border-radius: 0.6rem !important; padding: 0.55rem 0.9rem !important; font-size: 0.85rem; background-color: #ffffff; }
        .django-form-fields input:focus { border-color: var(--primary) !important; box-shadow: 0 0 0 3px rgba(73, 0, 92, 0.05) !important; outline: none; }
        .django-form-fields .helptext { display: block; font-size: 0.7rem; color: var(--on-surface-variant); margin-top: 0.2rem; opacity: 0.85; line-height: 1.3; }
    </style>
</head>
<body>
<main class="signup-container">
    <div class="logo-section">
        <img src="{% static 'images/delifood.png' %}" class="logo-img" alt="DeliFood Logo">
        <h1 class="headline">Reset Password</h1>
    </div>
    <div class="signup-card">
        {% if form.errors %}
            <div class="error-alert">
                <p class="fw-bold mb-0">Passwords must match and meet corporate security parameters.</p>
            </div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="django-form-fields">
                {{ form.as_p }}
            </div>
            <button class="btn-signup" type="submit">
                <span class="material-symbols-outlined fs-5">published_with_changes</span> Update Password
            </button>
        </form>
    </div>
</main>
</body>
</html>
