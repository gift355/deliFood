<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeliFood Test</title>
    <style>
        /* Minimal CSS just to see the layout */
        nav { background: #eee; padding: 10px; margin-bottom: 20px; border-bottom: 1px solid #ccc; }
        .container { max-width: 900px; margin: auto; padding: 20px; }
        .logout-btn { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <nav>
        <strong>DeliFood Navigation</strong> | 
        {% if user.is_authenticated %}
            <span>Logged in as: <strong>{{ user.username }}</strong> ({{ user.role }})</span> | 
            <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a> | 
            <a href="{% url 'signup' %}">Sign Up</a>
        {% endif %}
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
